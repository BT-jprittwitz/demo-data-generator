# Lokale Testinstanz fuer die automatische Installationspruefung vor Auslieferung.
#
# Status: in Benutzung und verifiziert (Docker auf der Entwicklungsmaschine
# verfuegbar). Ablauf siehe docker/README.md und AGENTS.md - kein --test-enable
# beim Installations-Smoketest.
#
# Odoo-Version bewusst auf 19.0 gepinnt, passend zur Zielversion aus HANDOVER.md.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    volumes:
      - odoo-db-data:/var/lib/postgresql/data

  odoo:
    image: odoo:19.0
    depends_on:
      - db
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    ports:
      - "8069:8069"
    volumes:
      - ../dist:/mnt/extra-addons
      - odoo-data:/var/lib/odoo

volumes:
  odoo-db-data:
  odoo-data:
