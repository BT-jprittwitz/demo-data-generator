# Lokale Testinstanz fuer die automatische Installationspruefung vor Auslieferung.
#
# Status: vorbereitet, aber auf der aktuellen Entwicklungsmaschine NICHT lauffaehig
# (kein Docker installiert). Gedacht fuer den Einsatz auf einer Maschine mit
# Docker (z.B. CI-Runner) - siehe docker/README.md fuer den vorgesehenen Ablauf.
#
# Odoo-Version bewusst auf 19.0 gepinnt, passend zur Zielversion aus HANDOVER.md.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    volumes:
      - odoo-db-data:/var/lib/postgresql/data

  odoo:
    image: odoo:19.0
    depends_on:
      - db
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    volumes:
      - ../dist:/mnt/extra-addons

volumes:
  odoo-db-data:
