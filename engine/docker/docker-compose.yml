# Local test instance for the automated installation check before delivery.
#
# Status: in use and verified (Docker available on the development machine).
# Procedure see engine/docker/README.md and AGENTS.md - no --test-enable for the
# installation smoke test.
#
# Odoo version intentionally pinned to 19.0, matching the target version.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    volumes:
      - odoo-db-data:/var/lib/postgresql/data

  odoo:
    image: odoo:19.0
    depends_on:
      - db
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    ports:
      - "8069:8069"
    volumes:
      - ../../dist:/mnt/extra-addons
      - odoo-data:/var/lib/odoo

volumes:
  odoo-db-data:
  odoo-data:
